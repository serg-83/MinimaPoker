<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minima Poker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="app/js/mds.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #1a2a1a 0%, #0a0f0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            color: #f0e6c8;
        }
        .splash {
            text-align: center;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
        }
        .logo {
            font-size: 5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(212,175,55,0.6));
        }
        h1 {
            font-size: 2.2rem;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #a09070;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .status-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.95rem;
        }
        .status-row:last-child { border-bottom: none; }
        .status-icon { font-size: 1.3rem; width: 28px; text-align: center; }
        .status-label { flex: 1; color: #c0b090; }
        .status-val { font-weight: bold; }
        .ok   { color: #4caf50; }
        .warn { color: #ff9800; }
        .err  { color: #f44336; }
        .loading { color: #888; font-style: italic; }

        .warning-box {
            background: rgba(244,67,54,0.1);
            border: 1px solid rgba(244,67,54,0.4);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            color: #ffb3ae;
            line-height: 1.5;
            display: none;
        }
        .warning-box strong { color: #f44336; display: block; margin-bottom: 6px; font-size: 1rem; }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-play {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a1a0a;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(212,175,55,0.4);
        }
        .btn-play:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(212,175,55,0.6); }
        .btn-play:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-grant {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            font-size: 0.9rem;
            padding: 10px 28px;
            margin-top: 10px;
        }
        .btn-grant:hover { background: rgba(212,175,55,0.1); }

        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(212,175,55,0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="splash">
    <div class="logo">🃏</div>
    <h1>Minima Poker</h1>
    <p class="subtitle">Decentralized Texas Hold'em</p>

    <div class="status-box">
        <div class="status-row">
            <span class="status-icon">🔗</span>
            <span class="status-label">Minima node</span>
            <span class="status-val" id="s-node"><span class="spinner"></span><span class="loading">connecting...</span></span>
        </div>
        <div class="status-row">
            <span class="status-icon">✍️</span>
            <span class="status-label">Write permission</span>
            <span class="status-val" id="s-write"><span class="spinner"></span><span class="loading">checking...</span></span>
        </div>
        <div class="status-row">
            <span class="status-icon">📡</span>
            <span class="status-label">Maxima</span>
            <span class="status-val" id="s-maxima"><span class="spinner"></span><span class="loading">checking...</span></span>
        </div>
    </div>

    <div class="warning-box" id="warn-write">
        <strong>⚠️ Write permission required</strong>
        This app needs WRITE access to sign transactions and manage payment channels.
        Please grant write permission in MiniHub, then reload.
    </div>

    <div id="btn-area">
        <button class="btn btn-play" id="playBtn" disabled onclick="goPlay()">
            <span class="spinner" id="play-spinner"></span>Play
        </button>
    </div>
</div>

<script>
    var _writeOk = false, _nodeOk = false, _maximaOk = false;

    function set(id, cls, text) {
        document.getElementById(id).innerHTML = '<span class="' + cls + '">' + text + '</span>';
    }

    function checkReady() {
        var btn = document.getElementById('playBtn');
        var sp  = document.getElementById('play-spinner');
        if (_nodeOk && _writeOk && _maximaOk) {
            btn.disabled = false;
            sp.style.display = 'none';
        }
    }

    MDS.init(function(msg) {
        if (msg.event !== 'inited') return;

        _nodeOk = true;
        set('s-node', 'ok', '✓ Connected');

        // Check write permission
        MDS.cmd('checkmode', function(res) {
            var write = res && res.response && res.response.writemode;
            _writeOk = !!write;
            if (_writeOk) {
                set('s-write', 'ok', '✓ Write');
            } else {
                set('s-write', 'err', '✗ Read only');
                document.getElementById('warn-write').style.display = 'block';
            }
            checkReady();
        });

        // Check Maxima
        MDS.cmd('maxima', function(res) {
            var connected = res && res.response && res.response.connected;
            _maximaOk = true; // Maxima not strictly required to play
            if (connected) {
                set('s-maxima', 'ok', '✓ Online');
            } else {
                set('s-maxima', 'warn', '⚠ Offline');
            }
            checkReady();
        });
    });

    function goPlay() {
        var uid = typeof MDS !== 'undefined' ? MDS.minidappuid : null;
        window.location.href = 'index.html' + (uid ? '?uid=' + encodeURIComponent(uid) : '');
    }
</script>
</body>
</html>
