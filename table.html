<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minima Poker - Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="app/js/mds.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="app/css/style.css">
    <link rel="stylesheet" href="app/css/table.css">
    <script src="app/js/decimal.js"></script>
    <script src="app/js/utils.js"></script>
    <script src="app/js/modal.js"></script>
    <script src="app/js/wallet.js"></script>
    <script src="app/js/crypto.js"></script>
    <script src="app/js/sql.js"></script>
    <script src="app/js/maxima.js"></script>
    <script src="app/js/channel.js"></script>
    <script src="app/js/poker.js"></script>
    <script src="app/js/table.js"></script>
</head>
<body class="table-page">
    <div class="container">
        <div class="table-topbar">
            <button type="button" id="backToLobby" class="topbar-btn" onclick="goBackToLobby()">&#8592;</button>
            <div id="channel-status" class="topbar-channel">
                <span id="channelStatusLabel"></span>
                <button type="button" id="createChannelBtn"  class="primary btn-sm" style="display:none">Create Channel</button>
                <button type="button" id="closeChannelBtn2"  class="primary btn-sm" style="display:none">Close Channel</button>
                <button type="button" id="cancelChannelBtn"  class="secondary btn-sm" style="display:none">Cancel &amp; Reclaim</button>
                <span   id="disputeCountdown" style="display:none;font-size:0.75rem;color:#aaa;"></span>
                <button type="button" id="claimSettleBtn"    class="primary btn-sm"   style="display:none">Claim Funds</button>
            </div>
        </div>
        <div id="game">
            <div class="poker-table">
                <div class="community-cards" id="community"></div>
                <div class="pot" id="pot">Pot: 0</div>
                <div id="seats"></div>
                <div class="controls" id="controls">
                    <button type="button" class="action-btn fold"  id="foldBtn"  disabled>Fold</button>
                    <button type="button" class="action-btn call"  id="callBtn"  disabled>Call</button>
                    <button type="button" class="action-btn raise" id="raiseBtn" disabled>Raise</button>
                    <button type="button" class="action-btn check" id="checkBtn" disabled>Check</button>
                </div>
                <div id="phase-controls">
                    <div id="phaseMsg"></div>
                    <button type="button" id="commitBtn"       class="primary btn-sm" style="display:none">Send Commit</button>
                    <button type="button" id="revealBtn"       class="primary btn-sm" style="display:none">Send Reveal</button>
                </div>
                <div id="status"></div>
            </div>
        </div>
    </div>

    <script>
        var tableId = (function() {
            var pairs = window.location.search.substring(1).split('&');
            for (var i = 0; i < pairs.length; i++) {
                var p = pairs[i].split('=');
                if (decodeURIComponent(p[0]) === 'tableId') return decodeURIComponent(p[1] || '');
            }
            return null;
        })();

        function goBackToLobby() {
            var uid = typeof MDS !== 'undefined' ? MDS.minidappuid : null;
            var dest = 'lobby.html' + (uid ? '?uid=' + encodeURIComponent(uid) : '');

            if (!tableId || typeof window.myMaximaKey === 'undefined' || !window.myMaximaKey) {
                window.location.href = dest;
                return;
            }

            var leaveMsg = { type: 'TABLE_LEAVE', tableId: tableId };
            try { if (typeof sql !== 'undefined') sql.removePlayerFromTable(tableId, window.myMaximaKey, function() {}); } catch(e) {}

            try {
                MDS.cmd('maxcontacts action:list', function(res) {
                    var contacts = (res && res.response && res.response.contacts) ? res.response.contacts : [];
                    var total = contacts.length, done = 0;
                    if (total === 0) { window.location.href = dest; return; }
                    for (var i = 0; i < contacts.length; i++) {
                        var key = contacts[i].publickey || '';
                        if (key && typeof maxima !== 'undefined') {
                            maxima.sendRaw(key, leaveMsg, function() {
                                if (++done >= total) window.location.href = dest;
                            });
                        } else {
                            if (++done >= total) window.location.href = dest;
                        }
                    }
                    // Fallback: redirect after 2s regardless
                    setTimeout(function() { window.location.href = dest; }, 2000);
                });
            } catch(e) {
                window.location.href = dest;
            }
        }

        window.addEventListener('beforeunload', function() {
            if (!tableId || !window.myMaximaKey) return;
            var leaveMsg = { type: 'TABLE_LEAVE', tableId: tableId };
            try { if (typeof sql !== 'undefined') sql.removePlayerFromTable(tableId, window.myMaximaKey, function() {}); } catch(e) {}
            // Best-effort sync send via navigator.sendBeacon not available in MDS context — just clean local DB
        });

        MDS.init(function(msg) {
            if (msg.event === 'inited') {
                initWallet(function(user) {
                    if (user) {
                        window.myMaximaName       = user.maximaName;
                        window.myMaximaKey        = user.maximaPublicKey;
                        window.myMinimaAddress    = user.minimaAddress;
                        window.myMinimaPublicKey  = user.minimaPublicKey;
                    }
                    sql.createTables(function() {
                        tableUI.init(tableId);
                        // Announce join to all contacts
                        var player = { pubKey: window.myMaximaKey, name: window.myMaximaName || '', address: window.myMinimaAddress || '', walletKey: window.myMinimaPublicKey || '' };
                        sql.addPlayerToTable(tableId, player, function() {});
                        MDS.cmd('maxcontacts action:list', function(res) {
                            var contacts = (res && res.response && res.response.contacts) ? res.response.contacts : [];
                            var joinMsg = { type: 'TABLE_JOIN', tableId: tableId, player: player };
                            for (var i = 0; i < contacts.length; i++) {
                                var key = contacts[i].publickey || '';
                                if (key) maxima.sendRaw(key, joinMsg, function() {});
                            }
                        });
                    });
                });
            } else if (msg.event === 'MDSCOMMS') {
                if (msg.data && msg.data.public === false) {
                    try {
                        var m = JSON.parse(msg.data.message);
                        if (m.type && tableUI.handleServiceMessage) tableUI.handleServiceMessage(m);
                    } catch (e) {}
                }
            } else if (msg.event === 'MAXIMA') {
                maxima.handleIncoming(msg);
            }
        });
    </script>
</body>
</html>
